# golangci-lint configuration shared by every telemed Go repo.
# The rule set is deliberately strict about the failure modes that actually bite
# a healthcare platform: ignored errors, unclosed rows, missing contexts, and
# SQL built by concatenation.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose      # an unclosed response body leaks a connection per call
    - contextcheck   # every downstream call must inherit the request context
    - copyloopvar
    - durationcheck
    - errorlint      # errors.Is/As instead of == and type assertions
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx          # no HTTP call without a context
    - prealloc
    - revive
    - rowserrcheck   # pgx rows.Err() must be checked or you silently truncate
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (github.com/rs/zerolog.Logger).Msg
    gosec:
      excludes:
        - G104  # duplicated by errcheck
      config:
        G306: "0640"
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments are reviewed by humans, not counted
        - name: context-as-argument
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: unreachable-code
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam       # value receivers on config structs are intentional
        - whyNoLint

  exclusions:
    rules:
      # Tests may ignore errors on cleanup and use weak randomness for fixtures.
      - path: _test\.go
        linters: [errcheck, gosec, prealloc, unparam]

      # PER-DOMAIN EXCLUSIONS CARRIED OVER FROM THE SOURCE REPOSITORIES.
      #
      # Seven of the nine services shared one .golangci.yml; two did not, and
      # both differences were deliberate and documented where they were made.
      # Consolidation adopted the majority config, which silently revoked them
      # and turned working code into a failing lint job. They are restored here
      # scoped to the domain that made the decision, so neither the original
      # judgement nor the stricter default is lost.

      # scheduling: a test helper that seeds a fixture row legitimately owns its
      # own context.Background() -- there is no inbound request to inherit from
      # -- and the ephemeral Postgres harness in main_test.go must outlive any
      # single test's context, which is why it is started with exec.Command and
      # reaped by Pdeathsig rather than by ctx cancellation. Both linters stay
      # ON for that domain's production code, where they catch what they exist
      # for.
      - path: internal/(modules|domain)/scheduling/.*_test\.go
        linters: [contextcheck, noctx]

      # payment: gocritic's performance tags fire constantly on in-memory test
      # fakes that range over maps of value structs. Copying 300 bytes per
      # iteration in a test that runs in microseconds is not a finding, and
      # silencing it keeps the real gocritic output readable.
      - path: internal/(modules|domain)/payment/.*_test\.go
        linters: [gocritic]
      # Migrations and generated protobuf are not hand-maintained.
      - path: (internal/pb|\.pb\.go)
        linters: [revive, gocritic, unparam, gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [telemed]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
