name: release

# Building and pushing lives here rather than in ci.yml so that exactly one
# workflow ever pushes a given tag. Two workflows racing to push :latest is a
# deploy that pulls whichever finished second.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel in progress: a cancelled run can leave :latest pointing at an
  # image whose migrate counterpart was never pushed.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server. ONE image: telemed-backend, telemed-video and
      # telemed-notification are this same image with different
      # TELEMED_DOMAINS, which is what the nine-service consolidation was for.
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The VPS is amd64. Adding arm64 doubles the build for an
          # architecture nothing here runs.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/versalife26/telemed-backend:latest
            ghcr.io/versalife26/telemed-backend:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          # Distinct scopes. A shared scope makes the two builds evict each
          # other's module cache on every run.
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false

      # The migration runner. Separate because the server image is FROM
      # scratch and has no shell, no migrate CLI and no migrations/.
      - name: migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.migrate
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/versalife26/telemed-migrate:latest
            ghcr.io/versalife26/telemed-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          provenance: false

  deploy:
    name: dispatch VPS deploy
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - name: notify versalife-docker
        env:
          GH_TOKEN: ${{ secrets.VERSALIFE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "VERSALIFE_DEPLOY_TOKEN is not set; images are pushed but the VPS was not updated."
            echo "Deploy by hand: ssh the box and run /opt/versalife-docker/scripts/deploy.sh"
            exit 0
          fi
          gh api repos/VersaLife26/versalife-docker/dispatches \
            -f event_type=deploy \
            -f 'client_payload[service]=telemed-backend' \
            -f "client_payload[sha]=${GITHUB_SHA}"
