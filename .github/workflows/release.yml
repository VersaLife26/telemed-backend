name: release

# Building and pushing lives here rather than in ci.yml so that exactly one
# workflow ever pushes a given tag. Two workflows racing to push :latest is a
# deploy that pulls whichever finished second.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel in progress: a cancelled run can leave :latest pointing at an
  # image whose migrate counterpart was never pushed.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server. ONE image: telemed-backend, telemed-video and
      # telemed-notification are this same image with different
      # TELEMED_DOMAINS, which is what the nine-service consolidation was for.
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The VPS is amd64. Adding arm64 doubles the build for an
          # architecture nothing here runs.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/versalife26/telemed-backend:latest
            ghcr.io/versalife26/telemed-backend:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          # Distinct scopes. A shared scope makes the two builds evict each
          # other's module cache on every run.
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false

      # The migration runner. Separate because the server image is FROM
      # scratch and has no shell, no migrate CLI and no migrations/.
      - name: migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.migrate
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/versalife26/telemed-migrate:latest
            ghcr.io/versalife26/telemed-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          provenance: false

  deploy:
    name: deploy to VPS
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - name: Deploy via SSH
        if: ${{ env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "==> Deploying telemed on VPS..."
            if [ -d "/opt/versalife-docker" ]; then
              cd /opt/versalife-docker
              if [ -f "scripts/deploy.sh" ]; then
                ./scripts/deploy.sh
              else
                docker compose pull backend migrate
                docker compose up -d backend
              fi
            elif [ -d "/root/telemed-backend" ]; then
              cd /root/telemed-backend
              git pull origin main
              docker compose build backend
              docker compose up -d backend
            else
              echo "Deploy target directory not found; running docker pull directly"
              docker pull ghcr.io/versalife26/telemed-backend:latest
            fi

      - name: notify versalife-docker
        if: ${{ env.GH_TOKEN != '' && env.VPS_SSH_KEY == '' }}
        env:
          GH_TOKEN: ${{ secrets.VERSALIFE_DEPLOY_TOKEN }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          gh api repos/VersaLife26/versalife-docker/dispatches \
            -f event_type=deploy \
            -f 'client_payload[service]=telemed-backend' \
            -f "client_payload[sha]=${GITHUB_SHA}"

      - name: warning if no deploy credentials configured
        if: ${{ env.GH_TOKEN == '' && env.VPS_SSH_KEY == '' }}
        env:
          GH_TOKEN: ${{ secrets.VERSALIFE_DEPLOY_TOKEN }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "::warning::Neither VPS_SSH_KEY nor VERSALIFE_DEPLOY_TOKEN is configured in GitHub repository secrets."
          echo "::warning::Images were built and pushed to ghcr.io, but the VPS was not automatically updated."
          echo "::warning::To enable automatic VPS deployment, add VPS_HOST, VPS_USER, and VPS_SSH_KEY (or VERSALIFE_DEPLOY_TOKEN) to GitHub Secrets."

