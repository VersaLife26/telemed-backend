# coturn for local development of the platform's own WebRTC stack.
#
# WHY THIS EXISTS
# A peer-to-peer call connects directly whenever one end's NAT reuses a port
# across destinations. Behind symmetric NAT or carrier-grade NAT it does not,
# and the media has to be relayed -- which is what this server does. Most of
# this platform's users reach it over Sri Lankan mobile networks, which are
# heavily CGNAT'd, so without a TURN relay a real and non-trivial share of
# consultations never connect at all.
#
# It is also the only way to TEST that path: on a LAN every call succeeds
# directly and the relay is never exercised, so a green result on /test proves
# nothing about the case that actually breaks.

listening-port=3478
listening-ip=0.0.0.0

# The address candidates are advertised on. It must be an address the OTHER
# device can reach -- 127.0.0.1 works only for a call to itself, which is not a
# call. Change this when the host's LAN address changes.
external-ip=10.96.249.199

# REST authentication (coturn calls it use-auth-secret).
#
# Rather than a fixed username and password, the backend mints a credential per
# join: the username encodes an expiry and the password is an HMAC of it under
# the shared secret below, which coturn verifies without storing any per-user
# state. A credential that leaks stops working on its own. See
# ICEConfig.Servers in internal/domain/consultation/signal/ice.go.
use-auth-secret
static-auth-secret=telemed-dev-turn-secret-not-for-production
realm=telemed.local

# The relay port range. Every concurrent relayed call takes ports from here, so
# a production deployment wants this much wider -- this is sized for a laptop.
min-port=49160
max-port=49200

fingerprint

# No TLS locally. `no-dtls` is deliberately absent: this coturn rejects it as an
# unknown option, and it is redundant anyway -- neither listener starts without
# a certificate and key.
#
# A production TURN must serve turns:// on 5349 with a real certificate. A plain
# TURN allocation over an untrusted network hands the relay credential to
# anyone on the path, and that credential is good until its expiry.
no-tls

# Refuse to relay to multicast. Loopback peers are NOT listed here: this coturn
# rejects `no-loopback-peers` as an unknown option ("Bad configuration format")
# because denying them became the built-in default -- `allow-loopback-peers` is
# now the opt-in. Keeping the old line would have looked like a control while
# coturn ignored it.
#
# The protection itself matters and is worth naming: without it, anyone who can
# reach the TURN server can relay to services bound to localhost on the machine
# running it, turning the relay into an SSRF pivot into the host.
no-multicast-peers

# A production TURN should go further and deny the RFC1918 ranges it has no
# business relaying into, e.g.
#   denied-peer-ip=10.0.0.0-10.255.255.255
# Not set here, because on a laptop the other end of the call IS on the LAN.

log-file=stdout
simple-log
